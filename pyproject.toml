[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hypercognitive-reasoning-engine"
version = "1.1.0"
description = "Deterministische, lokale neuro-symbolische Reasoning- und Multi-Universen-Synthese-Engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Manus AI"}]
dependencies = []

[project.scripts]
hypercognitive-engine = "hypercognitive_engine.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
